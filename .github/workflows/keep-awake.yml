# Render's free plan sleeps after 15 minutes without visits.
# This pings the site every 10 minutes so it is always ready for a demo.
name: Keep site awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ProxyPilot
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://proxypilot-9f7s.onrender.com/api/health || true
